<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="FocusBoard, a personal task and project management application."
    />

    <title>FocusBoard</title>
  </head>

  <body>
    <div class="app">
      <header class="app-header">
        <a class="brand" href="#" aria-label="FocusBoard home">
          <span class="brand__logo" aria-hidden="true">F</span>
          <span class="brand__name">FocusBoard</span>
        </a>

        <button
          id="open-todo-form"
          class="primary-button"
          type="button"
        >
          New task
        </button>
      </header>

      <aside class="sidebar">
        <nav class="sidebar-nav" aria-label="Task filters">
          <button
            class="sidebar-nav__button sidebar-nav__button--active"
            type="button"
            data-view="inbox"
          >
            Inbox
          </button>

          <button
            class="sidebar-nav__button"
            type="button"
            data-view="today"
          >
            Today
          </button>

          <button
            class="sidebar-nav__button"
            type="button"
            data-view="upcoming"
          >
            Upcoming
          </button>

          <button
            class="sidebar-nav__button"
            type="button"
            data-view="completed"
          >
            Completed
          </button>
        </nav>

        <section class="projects-section">
          <div class="projects-section__header">
            <h2 class="projects-section__title">Projects</h2>

            <button
              id="open-project-form"
              class="icon-button"
              type="button"
              aria-label="Create a new project"
            >
              +
            </button>
          </div>

          <div
            id="projects-list"
            class="projects-list"
            aria-label="Projects"
          ></div>
        </section>
      </aside>

      <main class="main-content">
        <section class="content-header">
          <div>
            <p class="content-header__label">Project</p>
            <h1 id="current-view-title">Inbox</h1>
          </div>
        </section>

        <section
          id="todos-list"
          class="todos-list"
          aria-label="Tasks"
        >
          <div class="empty-state">
            <h2 class="empty-state__title">No tasks yet</h2>

            <p class="empty-state__description">
              Create your first task to start organizing this project.
            </p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
